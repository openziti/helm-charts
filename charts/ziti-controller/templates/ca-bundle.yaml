{{- if and .Values.ctrlPlaneCasBundle.configMapName .Values.ctrlPlaneCasBundle.caCert -}}
  {{- fail "Set only one of ctrlPlaneCasBundle.configMapName (use an existing ConfigMap) or ctrlPlaneCasBundle.caCert (render one from a PEM)." -}}
{{- end -}}
{{- /* Render the trust-manager Bundle only when neither an external ConfigMap nor an
       inline PEM was supplied. */ -}}
{{- if and (not .Values.ctrlPlaneCasBundle.configMapName) (not .Values.ctrlPlaneCasBundle.caCert) }}
---
# Trust bundle containing all CA certificates needed for the Ziti network.
# With the unified PKI, all certificates chain to the edge-root CA via the edge-signer intermediate.
# This Bundle is only rendered once per cluster (during init), not for joining nodes.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ include "ziti-controller.fullname" . }}-ctrl-plane-cas
spec:
  sources:
    # NOTE: cert-manager sets a CA-issued Secret's ca.crt to the ROOT-most certificate of
    # the chain, so this resolves to the edge-root CA, not the edge-signer intermediate.
    # Peers validate a member's leaf using this root plus the intermediate that the member
    # presents on the wire (its tls.crt is leaf + its own edge-signer).
    - secret:
        name: {{ include "ziti-controller.fullname" . }}-edge-signer-secret
        key: ca.crt
  target:
    configMap:
      key: {{ include "ziti-controller.ctrlPlaneCasFile" . }}
    {{- with .Values.ctrlPlaneCasBundle.namespaceSelector }}
    namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
